<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMW M4 Cinematic Portfolio</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: Arial, sans-serif;
  }

  /* UI */
  #ui {
    position: absolute;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
    color: white;
    text-align: center;
  }

  h1 {
    font-size: 52px;
    background: linear-gradient(90deg, #38bdf8, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 0;
  }

  p {
    color: #aaa;
    margin-top: 10px;
  }

  button {
    margin-top: 25px;
    padding: 12px 20px;
    background: #38bdf8;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
  }

  canvas { display: block; }
</style>
</head>

<body>

<div id="ui">
  <h1>ADITYA SHUKLA</h1>
  <p>BMW M4 Ultra Cinematic 3D Experience</p>
  <button onclick="startExperience()">START DRIVE</button>
</div>

<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
let scene, camera, renderer, car, clock;

scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 5, 25);

camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 2, 6);

renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

clock = new THREE.Clock();

// LIGHTS
let light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(5,5,5);
scene.add(light);

let ambient = new THREE.AmbientLight(0x404040);
scene.add(ambient);

// ROAD
let roadGeo = new THREE.PlaneGeometry(50, 200);
let roadMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
let road = new THREE.Mesh(roadGeo, roadMat);
road.rotation.x = -Math.PI / 2;
road.position.y = 0;
scene.add(road);

// CAR (PLACEHOLDER BOX - replace with BMW model later)
let carGeo = new THREE.BoxGeometry(1.5, 0.5, 3);
let carMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8 });
car = new THREE.Mesh(carGeo, carMat);
car.position.y = 0.5;
scene.add(car);

// SMOKE PARTICLES
let smokeGeo = new THREE.BufferGeometry();
let smokeCount = 300;
let pos = [];

for (let i = 0; i < smokeCount; i++) {
  pos.push(
    (Math.random() - 0.5) * 10,
    Math.random() * 3,
    (Math.random() - 0.5) * 10
  );
}

smokeGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
let smokeMat = new THREE.PointsMaterial({ color: 0x888888, size: 0.08 });
let smoke = new THREE.Points(smokeGeo, smokeMat);
scene.add(smoke);

// CAMERA SHAKE CONTROL
let shake = 0;

// ANIMATE
function animate(){
  requestAnimationFrame(animate);

  let t = clock.getElapsedTime();

  // car movement (speed effect)
  car.position.z -= 0.05;

  // camera follow + shake
  camera.position.z = car.position.z + 6;
  camera.position.y = 2 + Math.sin(t * 3) * 0.05;

  camera.lookAt(car.position);

  smoke.position.z -= 0.03;

  // slight shake effect
  camera.position.x = Math.sin(t * 20) * shake;

  renderer.render(scene, camera);
}
animate();

// ENGINE SOUND
let engine = new Audio("https://www.fesliyanstudios.com/play-mp3/438");
engine.loop = true;

// START EXPERIENCE
function startExperience(){
  document.getElementById("ui").style.display = "none";

  engine.play().catch(()=>{});

  shake = 0.02;

  setTimeout(()=>{
    shake = 0.005;
  }, 3000);
}

// RESIZE
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
