<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMW Cinematic Portfolio</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: Arial;
}

/* INTRO */
#ui {
  position: fixed;
  width: 100%;
  height: 100vh;
  background: black;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  color: white;
}

h1 {
  font-size: 50px;
  background: linear-gradient(90deg,#38bdf8,#a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

button {
  margin-top: 20px;
  padding: 12px 20px;
  background: #38bdf8;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

/* CANVAS */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 1;
}
</style>
</head>

<body>

<!-- UI -->
<div id="ui">
  <h1>ADITYA SHUKLA</h1>
  <button onclick="startExperience()">START DRIVE</button>
</div>

<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
let renderer = new THREE.WebGLRenderer({antialias:true});

renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

camera.position.set(0,2,6);

// LIGHT
let light = new THREE.DirectionalLight(0xffffff,2);
light.position.set(5,5,5);
scene.add(light);

// ROAD
let road = new THREE.Mesh(
  new THREE.PlaneGeometry(100,100),
  new THREE.MeshStandardMaterial({color:0x111111})
);
road.rotation.x = -Math.PI/2;
scene.add(road);

// CAR
let car = new THREE.Mesh(
  new THREE.BoxGeometry(1.5,0.5,3),
  new THREE.MeshStandardMaterial({color:0x38bdf8})
);
car.position.y = 0.5;
scene.add(car);

// SMOKE
let geo = new THREE.BufferGeometry();
let arr = [];

for(let i=0;i<400;i++){
  arr.push((Math.random()-0.5)*10, Math.random()*2, (Math.random()-0.5)*10);
}

geo.setAttribute('position', new THREE.Float32BufferAttribute(arr,3));
let smoke = new THREE.Points(geo, new THREE.PointsMaterial({color:0x777777,size:0.05}));
scene.add(smoke);

// SOUND
let engine = new Audio("https://www.fesliyanstudios.com/play-mp3/438");
engine.loop = true;

let speed = 0;

// ANIMATE
function animate(){
  requestAnimationFrame(animate);

  speed += 0.002;

  car.position.z -= 0.08;

  camera.position.z = car.position.z + 6;
  camera.position.y = 2;

  camera.lookAt(car.position);

  smoke.rotation.y += 0.002;

  renderer.render(scene,camera);
}
animate();

// START EXPERIENCE (IMPORTANT FIX)
function startExperience(){
  document.getElementById("ui").style.display = "none";  // FIX HERE

  engine.play().catch(()=>{});

  console.log("Portfolio Loaded"); // debug
}

// RESIZE
addEventListener('resize',()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
